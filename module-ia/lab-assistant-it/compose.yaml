services:
  assistant:
    build: ./app
    ports:
      - "8090:5000"
    environment:
      MCP_GATEWAY_URL: http://mcp-gateway:8811/mcp
      MCP_GATEWAY_AUTH_TOKEN: jeton-du-lab-a5
    depends_on:
      - mcp-gateway
    models:
      llm:
        endpoint_var: MODEL_URL
        model_var: MODEL_NAME

  mcp-gateway:
    image: docker/mcp-gateway:v0.44.3
    command:
      - --servers=duckduckgo
      - --transport=streaming
      - --port=8811
    environment:
      MCP_GATEWAY_AUTH_TOKEN: jeton-du-lab-a5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

models:
  llm:
    model: ai/qwen3:1.7b
    context_size: 8192
