server {
    listen 80;
    server_name localhost;

    # DNS interne de Docker : Nginx re-resout "app" toutes les 10 s.
    # Ainsi Nginx demarre meme si l'app est arretee, et suit le changement
    # d'adresse IP quand le conteneur app est recree.
    resolver 127.0.0.11 valid=10s;
    set $upstream_app http://app:5000;

    # Proxy vers l'application Flask
    location / {
        proxy_pass         $upstream_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Page affichee quand l'application est indisponible
    error_page 502 503 504 = @maintenance;
    location @maintenance {
        default_type text/html;
        return 503 '<h1>IT-Support Portal en maintenance</h1><p>L application redemarre, reessayez dans quelques secondes.</p>';
    }
}
