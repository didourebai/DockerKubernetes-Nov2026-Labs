# docker-compose.yml -- Module 05 Lab reseau-compose
# Architecture : proxy (Nginx) -> api (whoami) -> cache (Redis)
#   - frontend : reseau public, seul le proxy publie un port
#   - backend  : reseau interne, sans acces Internet

# Nom du projet : fixe le prefixe des reseaux (lab-reseau_frontend, lab-reseau_backend)
name: lab-reseau

services:

  proxy:
    image: nginx:alpine
    ports:
      - "${PROXY_PORT:-8080}:80"          # Seul point d'entree depuis l'hote
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - frontend

  api:
    image: traefik/whoami:v1.10.3         # Affiche le nom et les IP du conteneur
    # Pas de "ports:" : l'API n'est joignable que depuis les reseaux Docker
    depends_on:
      cache:
        condition: service_healthy        # Attend que Redis reponde avant de demarrer
    networks:
      frontend:
        aliases:
          - backend-api                   # Second nom DNS, valable sur frontend seulement
      backend:

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # Boite a outils pour tester le reseau backend de l'interieur
  outils:
    image: busybox:1.36
    command: sleep 3600
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true                        # Aucun acces vers/depuis l'exterieur
    ipam:
      config:
        - subnet: 10.50.0.0/24            # Plage d'adresses choisie
