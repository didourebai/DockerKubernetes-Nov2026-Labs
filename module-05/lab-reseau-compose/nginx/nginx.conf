server {
    listen 80;
    server_name localhost;

    # DNS interne de Docker : Nginx re-resout "api" toutes les 5 s.
    # Quand l'API est scalee, Nginx repartit les requetes entre les conteneurs.
    resolver 127.0.0.11 valid=5s;
    set $upstream_api http://api:80;

    # Page d'accueil servie directement par Nginx
    location = / {
        default_type text/plain;
        return 200 'Proxy OK - essayez /api/\n';
    }

    # Tout ce qui commence par /api/ est transmis au service api
    location /api/ {
        proxy_pass         $upstream_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
